# AFly 語言檔（繁體中文）
# 顏色代碼用 '&'。可用變數：{residence} {cost} {balance} {player} {arg} {cost_res} {cost_wild}

fly-enabled: "&a已開啟付費飛行！雙擊空白鍵即可起飛，飛行時將依所在區域計費。"
fly-disabled: "&c已關閉付費飛行。"
players-only: "&c此指令僅限玩家使用。"
no-permission: "&c你沒有權限這麼做。"
reloaded: "&aAFly 設定已重新載入。"
unknown-arg: "&c未知的參數：&f{arg}&c，請輸入 &f/afly help&c。"

takeoff-residence: "&e你已起飛！這裡是 &a你的領地「{residence}」&e，費率 &a{cost}&e/秒。"
takeoff-other: "&e你已起飛！這裡是 &6別人的領地「{residence}」&e，以荒野費率計費，&c{cost}&e/秒。"
takeoff-wild: "&e你已起飛！這裡是 &c荒野（領地外）&e，費率 &c{cost}&e/秒。"

enter-residence: "&6⚠ 你已進入你的領地「{residence}」，費率變為 &a{cost}&6/秒。"
enter-other: "&6⚠ 你已進入別人的領地「{residence}」，以荒野費率計費，&c{cost}&6/秒。"
enter-wild: "&6⚠ 你已離開領地、進入荒野，費率變為 &c{cost}&6/秒。"

owner-notify: "&b[AFly] &f玩家 &e{player} &f正在你的領地 &a「{residence}」&f 飛行。"

actionbar-residence: "&a✈ 自己領地內飛行中 &7| 費率 &e{cost}&7/秒 &8| &7餘額 &e{balance}"
actionbar-other: "&6✈ 飛行於「{residence}」（非你的領地）&7| 費率 &e{cost}&7/秒 &8| &7餘額 &e{balance}"
actionbar-wild: "&c✈ 荒野飛行中 &7| 費率 &e{cost}&7/秒 &8| &7餘額 &e{balance}"

insufficient: "&4[AFly] &c餘額不足，已強制關閉飛行！請補充金錢後重新輸入 &f/afly on&c。"

status-on: "&f你的付費飛行：&a已開啟"
status-off: "&f你的付費飛行：&c未開啟"

# 飛行明細（飛行結束時顯示）。{duration} {spent}
summary-line: "&b[AFly] &f你飛行了 &e{duration}&f，共花費 &e{spent}&f。"
summary-hint: "&7&o（不想看明細？輸入 /afly summary off）"
summary-on: "&a已開啟飛行明細。"
summary-off: "&c已關閉飛行明細。"
# {duration} 使用的時間單位
dur-min: "分"
dur-sec: "秒"

# 地主通知開關
notify-on: "&a當有玩家在你的領地飛行時，你將收到通知。"
notify-off: "&c你將不再收到他人在你領地飛行的通知。"

# 語言切換指令
lang-changed: "&a伺服器語言已設為 &e{lang}&a 並重新載入。"
lang-usage: "&c用法：&f/afly lang <語言>&c。可用：&f{langs}"

info:
  - "&b===== AFly 費率 ====="
  - "&f領地內費率：&a{cost_res}&f/秒"
  - "&f荒野費率：　&c{cost_wild}&f/秒"

help:
  - "&8&m-------------------------------"
  - "  &b&l✈ AFly &f— 付費飛行"
  - "  &7/afly on   &8- &f開啟付費飛行（之後雙擊空白鍵起飛）"
  - "  &7/afly off  &8- &f關閉付費飛行"
  - "  &7/afly info &8- &f查看費率與自己的狀態"
  - "  &7/afly summary on|off &8- &f開關你的飛行明細"
  - "  &7/afly notify on|off &8- &f開關「他人在你領地飛行」的通知"
  - "  &7/afly lang <語言> &8- &f設定伺服器語言 &8(管理員)"
  - "  &7/afly reload &8- &f重新載入設定與語言 &8(管理員)"
  - "  &7/afly help &8- &f顯示本說明"
  - "  &f費率：領地內 &a{cost_res}&f/秒、荒野 &c{cost_wild}&f/秒"
  - "&8&m-------------------------------"
