# AFly language file (English)
# Color codes use '&'. Placeholders: {residence} {cost} {balance} {player} {arg} {cost_res} {cost_wild}

fly-enabled: "&aPaid flight enabled! Double-tap space to take off — you'll be charged based on your location."
fly-disabled: "&cPaid flight disabled."
players-only: "&cThis command can only be used by players."
no-permission: "&cYou don't have permission to do that."
reloaded: "&aAFly configuration reloaded."
unknown-arg: "&cUnknown argument: &f{arg}&c. Type &f/afly help&c."

takeoff-residence: "&eYou took off! You're in &ayour residence \"{residence}\"&e — rate &a{cost}&e/sec."
takeoff-other: "&eYou took off! You're in &6someone else's residence \"{residence}\"&e — charged as wilderness, rate &c{cost}&e/sec."
takeoff-wild: "&eYou took off! You're in the &cwilderness&e — rate &c{cost}&e/sec."

enter-residence: "&6⚠ Entered your residence \"{residence}\" — rate is now &a{cost}&6/sec."
enter-other: "&6⚠ Entered someone else's residence \"{residence}\" — charged as wilderness, rate &c{cost}&6/sec."
enter-wild: "&6⚠ Left into the wilderness — rate is now &c{cost}&6/sec."

owner-notify: "&b[AFly] &e{player} &fis flying in your residence &a\"{residence}\"&f."

actionbar-residence: "&a✈ Flying in your residence &7| rate &e{cost}&7/sec &8| &7bal &e{balance}"
actionbar-other: "&6✈ Flying in \"{residence}\" (not yours) &7| rate &e{cost}&7/sec &8| &7bal &e{balance}"
actionbar-wild: "&c✈ Flying in wilderness &7| rate &e{cost}&7/sec &8| &7bal &e{balance}"

insufficient: "&4[AFly] &cInsufficient funds — flight disabled. Top up, then &f/afly on&c again."

status-on: "&fYour paid flight: &aON"
status-off: "&fYour paid flight: &cOFF"

# Flight summary (shown when flight ends). {duration} {spent}
summary-line: "&b[AFly] &fYou flew for &e{duration}&f and spent &e{spent}&f in total."
summary-hint: "&7&o(Don't want this? /afly summary off)"
summary-on: "&aFlight summary enabled."
summary-off: "&cFlight summary disabled."
# Duration units used by {duration}
dur-min: "m"
dur-sec: "s"

# Residence-owner alert toggle
notify-on: "&aYou'll be alerted when players fly in your residences."
notify-off: "&cYou'll no longer be alerted about flights in your residences."

# Language command
lang-changed: "&aServer language set to &e{lang}&a and reloaded."
lang-usage: "&cUsage: &f/afly lang <language>&c. Available: &f{langs}"

info:
  - "&b===== AFly ====="
  - "&fResidence rate: &a{cost_res}&f/sec"
  - "&fWilderness rate: &c{cost_wild}&f/sec"

help:
  - "&8&m-------------------------------"
  - "  &b&l✈ AFly &f— paid flight"
  - "  &7/afly on   &8- &fEnable paid flight (then double-tap space)"
  - "  &7/afly off  &8- &fDisable paid flight"
  - "  &7/afly info &8- &fShow rates and your status"
  - "  &7/afly summary on|off &8- &fToggle your flight summary"
  - "  &7/afly notify on|off &8- &fToggle alerts for flights in your land"
  - "  &7/afly lang <language> &8- &fSet server language &8(admin)"
  - "  &7/afly reload &8- &fReload config & language &8(admin)"
  - "  &7/afly help &8- &fShow this help"
  - "  &fRates: residence &a{cost_res}&f/sec, wilderness &c{cost_wild}&f/sec"
  - "&8&m-------------------------------"
