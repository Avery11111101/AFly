# ============================================================
#  AFly 設定檔
#  作者：avery11111102、Avery11111101
#  GitHub：https://github.com/Avery11111101/AFly
# ============================================================

# 使用哪個語言檔：lang/<language>.yml（內建 en、zh_TW）
# 提示：改這裡再執行 /afly reload —— 本檔的「註解」也會跟著切換成所選語言（若有對應模板）。
language: zh_TW

# 每隔多少 tick 扣一次款（20 tick = 1 秒）
interval-ticks: 20

# 每次扣款金額
cost:
  # 荒野，或「別人的」領地（只有自己的領地才算便宜費率）
  wilderness: 5.0
  # 自己「擁有」的領地內
  residence: 1.0

# 哪些遊戲模式飛行時會被收費（其餘模式免費）
charged-gamemodes:
  - SURVIVAL
  - ADVENTURE

# 在他人領地飛行時，是否通知該領地擁有者
notify-owner: true

# 動作列是否顯示剩餘餘額
actionbar-show-balance: true

# 允許付費飛行的地點。在不允許的地方飛行會把玩家安全放下。
flight-allowed:
  # AFly 生效的世界。留空 = 所有世界；否則只在列出的世界生效。
  worlds: []
  # 是否允許在領地內付費飛行
  inside-residence: true
  # 是否允許在領地外（荒野）付費飛行
  outside-residence: true

# 跨越領地邊界（領地↔荒野）時是否維持飛行。
#  true  = 邊界不會掉下來；繼續飛行，只跳出費率變更提示。
#  false = 在邊界會掉到地上；用 /afly on 重新飛行。
# 摔落傷害：系統造成的墜落（禁飛區、沒錢、領地邊界）會免傷；
# 但若玩家開著飛行卻自願往下跳、沒按兩下起飛，仍照常受到摔落傷害。
keep-flying-across-regions: true
