# ============================================================
#  AFly configuration
#  Authors: avery11111102, Avery11111101
#  GitHub: https://github.com/Avery11111101/AFly
# ============================================================

# Which language file to use: lang/<language>.yml (bundled: en, zh_TW)
# Tip: change this and run /afly reload — the comments in THIS file will
#      also switch to the selected language (when a template is available).
language: en

# Ticks between each charge (20 ticks = 1 second)
interval-ticks: 20

# Cost taken per charge
cost:
  # Wilderness, OR someone else's residence (only your own land gets the cheap rate)
  wilderness: 5.0
  # Inside a residence you OWN
  residence: 1.0

# Which game modes are charged while flying (others fly for free)
charged-gamemodes:
  - SURVIVAL
  - ADVENTURE

# Notify a region's owner when someone else flies inside their region
notify-owner: true

# Show remaining balance on the action bar
actionbar-show-balance: true

# Where paid flight is allowed. Flying in a disallowed spot drops the player safely.
flight-allowed:
  # Worlds where AFly works. Empty = all worlds; otherwise only the listed worlds.
  worlds: []
  # Allow paid flight inside residences
  inside-residence: true
  # Allow paid flight outside residences (wilderness)
  outside-residence: true

# Keep players airborne when crossing region boundaries (residence <-> wilderness).
#  true  = don't drop them at a boundary; keep flying and just show the new rate.
#  false = they drop to the ground at boundaries; run /afly on to fly again.
# Fall damage: system-caused drops (no-fly zone, out of money, region boundary)
# are protected; a player who has flight on but chooses to fall without flying
# still takes normal fall damage.
keep-flying-across-regions: true
